name: pepetex

x-pepetex-runtime-env: &pepetex-runtime-env
  APP_URL: ${APP_URL:-http://localhost:3000}
  DATABASE_URL: ${DATABASE_URL:-postgresql://pepetex:pepetex@postgres:5432/pepetex}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379}
  GCS_BUCKET: ${GCS_BUCKET:-pepetex-dev}
  MAX_UPLOAD_FILE_BYTES: ${MAX_UPLOAD_FILE_BYTES:-31457280}
  REFERENCE_FILE_RETENTION_DAYS: ${REFERENCE_FILE_RETENTION_DAYS:-30}
  MAX_IMAGES_PER_DECK: ${MAX_IMAGES_PER_DECK:-5}
  PROVIDER_CREDENTIAL_ENCRYPTION_KEY: ${PROVIDER_CREDENTIAL_ENCRYPTION_KEY:-}
  DISABLE_EXTERNAL_TELEMETRY: ${DISABLE_EXTERNAL_TELEMETRY:-false}

services:
  postgres:
    profiles: ["local-postgres"]
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pepetex}
      POSTGRES_USER: ${POSTGRES_USER:-pepetex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pepetex}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5435}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-pepetex} -d $${POSTGRES_DB:-pepetex}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    profiles: ["local-redis"]
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: ${PEPETEX_WEB_IMAGE:-pepetex-web:latest}
    environment:
      <<: *pepetex-runtime-env
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
    expose:
      - "3000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000').then((response)=>process.exit(response.ok?0:1)).catch(()=>process.exit(1))\""
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    image: ${PEPETEX_WORKER_IMAGE:-pepetex-worker:latest}
    environment:
      <<: *pepetex-runtime-env
      NODE_ENV: production
    depends_on:
      redis:
        condition: service_healthy
        required: false
    restart: unless-stopped

  nginx:
    build:
      context: .
      dockerfile: deploy/nginx/Dockerfile
    image: ${PEPETEX_NGINX_IMAGE:-pepetex-nginx:latest}
    environment:
      NGINX_SERVER_NAME: ${NGINX_SERVER_NAME:-localhost}
      NGINX_CLIENT_MAX_BODY_SIZE: ${NGINX_CLIENT_MAX_BODY_SIZE:-50m}
      NGINX_CERT_RELOAD_INTERVAL_SECONDS: ${NGINX_CERT_RELOAD_INTERVAL_SECONDS:-300}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - certbot-webroot:/var/www/certbot
      - letsencrypt:/etc/letsencrypt
    depends_on:
      - web
    restart: unless-stopped

  certbot-init:
    profiles: ["certbot-init"]
    image: certbot/certbot:v2.11.0
    environment:
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:-}
      NGINX_SERVER_NAME: ${NGINX_SERVER_NAME:-}
    volumes:
      - certbot-webroot:/var/www/certbot
      - letsencrypt:/etc/letsencrypt
    entrypoint: /bin/sh
    command:
      - -c
      - |
        set -eu
        test -n "$${LETSENCRYPT_EMAIL}" || { echo "LETSENCRYPT_EMAIL is required." >&2; exit 1; }
        test -n "$${NGINX_SERVER_NAME}" || { echo "NGINX_SERVER_NAME is required." >&2; exit 1; }
        certbot certonly \
          --webroot \
          --webroot-path=/var/www/certbot \
          --email "$${LETSENCRYPT_EMAIL}" \
          --agree-tos \
          --no-eff-email \
          --non-interactive \
          --domain "$${NGINX_SERVER_NAME}"

  certbot-renew:
    profiles: ["certbot-renew"]
    image: certbot/certbot:v2.11.0
    volumes:
      - certbot-webroot:/var/www/certbot
      - letsencrypt:/etc/letsencrypt
    entrypoint: /bin/sh
    command:
      - -c
      - |
        trap exit TERM
        while :; do
          certbot renew --webroot --webroot-path=/var/www/certbot --quiet || true
          sleep 12h & wait $${!}
        done
    restart: unless-stopped

  migrate:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: deploy/migrate/Dockerfile
    image: ${PEPETEX_MIGRATE_IMAGE:-pepetex-migrate:latest}
    environment:
      <<: *pepetex-runtime-env
      NODE_ENV: production
    command: ["yarn", "workspace", "@pepetex/db", "db:migrate:deploy"]
    restart: "no"

  seed:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: deploy/migrate/Dockerfile
    image: ${PEPETEX_MIGRATE_IMAGE:-pepetex-migrate:latest}
    environment:
      <<: *pepetex-runtime-env
      NODE_ENV: production
      FIRST_ADMIN_EMAIL: ${FIRST_ADMIN_EMAIL:-}
      FIRST_ADMIN_NAME: ${FIRST_ADMIN_NAME:-PepeteX Admin}
      FIRST_ADMIN_PASSWORD_HASH: ${FIRST_ADMIN_PASSWORD_HASH:-}
    command: ["yarn", "workspace", "@pepetex/db", "db:seed"]
    restart: "no"

volumes:
  postgres-data:
  redis-data:
  certbot-webroot:
  letsencrypt:
